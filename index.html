<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأدمن - تسجيلات الحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ecf0f1;
    --card-bg: #ffffff;
    --header-bg: #34495e;
    --header-text: #ffffff;
    --primary: #2c3e50;
    --accent: #2980b9;
    --success: #27ae60;
    --success-dark: #1e8449;
    --danger: #c0392b;
    --warning: #e67e22;
    --warning-bg: #fef5e7;
    --danger-bg: #fdecea;
    --gray-btn: #95a5a6;
    --gray-btn-dark: #7f8c8d;
    --text-main: #2c3e50;
    --text-muted: #7f8c8d;
    --border: #dfe4e6;
    --row-alt: #f7f9fa;
    --row-hover: #eef3f6;
    --shadow: 0 2px 10px rgba(0,0,0,0.08);
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
  }

  header.app-header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }

  header.app-header .logo-mark {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    flex-shrink: 0;
  }

  header.app-header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .toolbar input[type="date"],
  .toolbar input[type="text"] {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    background: #fff;
    color: var(--text-main);
    min-width: 160px;
  }

  .toolbar input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .btn {
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
    white-space: nowrap;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(0.92); }

  .btn-gray { background: var(--gray-btn); color: #fff; }
  .btn-gray:hover { background: var(--gray-btn-dark); }

  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: var(--success-dark); }

  .counter-badge {
    margin-inline-start: auto;
    background: var(--primary);
    color: #fff;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }

  main {
    padding: 16px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .status-banner {
    padding: 12px 16px;
    border-radius: var(--radius);
    margin-bottom: 14px;
    font-weight: 600;
    font-size: 14px;
    display: none;
  }

  .status-banner.error {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #f5c6cb;
    display: block;
  }

  .status-banner.loading {
    background: #eaf2fa;
    color: var(--accent);
    border: 1px solid #cfe2f3;
    display: block;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead th {
    background: var(--header-bg);
    color: #fff;
    padding: 12px 10px;
    text-align: right;
    font-weight: 700;
    position: sticky;
    top: 0;
    white-space: nowrap;
  }

  tbody td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }

  td.name-cell { font-weight: 700; color: var(--primary); }

  td.address-cell {
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: help;
  }

  td.missing-cell {
    color: var(--danger);
    font-weight: 600;
    font-style: italic;
  }

  .check-in-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    background: #e8f8f0;
    color: var(--success-dark);
    font-weight: 700;
    font-size: 13px;
  }

  .check-out-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--warning-bg);
    color: var(--warning);
    font-weight: 700;
    font-size: 13px;
  }

  .delay-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--danger-bg);
    color: var(--danger);
    font-weight: 700;
    font-size: 13px;
  }

  .extra-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    background: #e8f8f0;
    color: var(--success-dark);
    font-weight: 700;
    font-size: 13px;
  }

  a.map-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
  }
  a.map-link:hover { text-decoration: underline; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 16px;
    font-weight: 600;
  }

  @media (max-width: 1100px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar input, .toolbar .btn { width: 100%; }
    .counter-badge { margin-inline-start: 0; text-align: center; }

    table, thead, tbody, th, tr, td {
      display: block;
      width: 100%;
    }

    thead { display: none; }

    tbody tr {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      background: var(--card-bg);
    }

    tbody tr:nth-child(even) { background: var(--card-bg); }

    tbody td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      text-align: left;
    }

    tbody td:last-child { border-bottom: none; }

    tbody td::before {
      content: attr(data-label);
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    td.address-cell {
      max-width: 100%;
      white-space: normal;
      text-align: right;
    }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="logo-mark">AT</div>
  <h1>لوحة الأدمن - تسجيلات الحضور</h1>
</header>

<div class="toolbar">
  <input type="date" id="dateFilter" aria-label="تصفية بالتاريخ">
  <input type="text" id="nameFilter" placeholder="ابحث باسم الموظف" aria-label="بحث بالاسم">
  <button class="btn btn-primary" id="applyBtn">عرض</button>
  <button class="btn btn-gray" id="resetBtn">عرض الكل</button>
  <button class="btn btn-success" id="exportBtn">تحميل Excel</button>
  <span class="counter-badge" id="counterBadge">عدد الموظفين: 0</span>
</div>

<main>
  <div class="status-banner" id="statusBanner"></div>

  <div class="card">
    <div style="overflow-x:auto;">
      <table id="attendanceTable">
        <thead>
          <tr>
            <th>م</th>
            <th>اسم الموظف</th>
            <th>التاريخ</th>
            <th>Check In</th>
            <th>Check In Location</th>
            <th>Check Out</th>
            <th>Check Out Location</th>
            <th>تأخير</th>
            <th>إضافي</th>
            <th>الموقع</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Rows injected by JS -->
        </tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">لا توجد تسجيلات مطابقة</div>
  </div>
</main>

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- SheetJS for Excel export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
(function () {
  'use strict';

  // ============================================================
  // Supabase configuration
  // ============================================================
    const SUPABASE_URL = 'https://itahlydnrzembvbqbrdu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0YWhseWRucnplbWJ2YnFicmR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTc5NjEsImV4cCI6MjEwNTMzMzk2MX0.0ErheMPDk_6wbhv49hb3pCAHilmnaf_bcWEEPOYGNyc';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============================================================
  // Constants
  // ============================================================
  const TABLE_NAME = 'attendance';
  const AUTO_REFRESH_INTERVAL_MS = 30000;
  const MISSING_TEXT = 'لم يسجل انصراف';
  const EMPTY_TEXT = '—';

  // ---- Work schedule (بتوقيت مصر) ----
  const WORK_START_HOUR = 10;      // 10:00 صباحاً
  const WORK_START_MINUTE = 0;
  const GRACE_MINUTES = 15;        // 15 دقيقة سماح → 10:15
  const WORK_END_HOUR = 18;        // 6:00 مساءً
  const WORK_END_MINUTE = 0;

  const WORK_START_TOTAL = WORK_START_HOUR * 60 + WORK_START_MINUTE; // 600 دقيقة
  const GRACE_LIMIT_TOTAL = WORK_START_TOTAL + GRACE_MINUTES;         // 615 دقيقة (10:15)
  const WORK_END_TOTAL = WORK_END_HOUR * 60 + WORK_END_MINUTE;       // 1080 دقيقة (18:00)

  // ============================================================
  // DOM references
  // ============================================================
  const dateFilterEl = document.getElementById('dateFilter');
  const nameFilterEl = document.getElementById('nameFilter');
  const applyBtn = document.getElementById('applyBtn');
  const resetBtn = document.getElementById('resetBtn');
  const exportBtn = document.getElementById('exportBtn');
  const counterBadge = document.getElementById('counterBadge');
  const statusBanner = document.getElementById('statusBanner');
  const tableBody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  const attendanceTable = document.getElementById('attendanceTable');

  let autoRefreshTimer = null;

  // ============================================================
  // Supabase query builder
  // ============================================================
  function buildQuery(date, name) {
    let query = supabase
      .from(TABLE_NAME)
      .select('*')
      .order('created_at', { ascending: true });

    if (date) {
      query = query.eq('check_date', date);
    }

    if (name) {
      query = query.ilike('name', '%' + name + '%');
    }

    return query;
  }

  // ============================================================
  // Date/time helpers
  // ============================================================
  function formatTime(isoString) {
    const d = new Date(isoString);
    return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  }

  function formatDate(dateString) {
    const d = new Date(dateString + 'T00:00:00');
    return d.toLocaleDateString('ar-EG');
  }

  /**
   * Gets Cairo local hours and minutes from an ISO timestamp.
   * Always uses Africa/Cairo timezone.
   */
  function getCairoTime(isoString) {
    const d = new Date(isoString);
    const formatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Africa/Cairo',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });
    const parts = formatter.formatToParts(d);
    const hours = parseInt(parts.find(p => p.type === 'hour').value, 10);
    const minutes = parseInt(parts.find(p => p.type === 'minute').value, 10);
    return { hours, minutes, totalMinutes: hours * 60 + minutes };
  }

  /**
   * Formats a duration in minutes into a human-readable Arabic string.
   * Examples: "15 دقيقة", "ساعة", "ساعتين", "3 ساعات و30 دقيقة"
   */
  function formatDuration(totalMinutes) {
    if (totalMinutes <= 0) return EMPTY_TEXT;

    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;

    const parts = [];
    if (hours > 0) {
      if (hours === 1) parts.push('ساعة');
      else if (hours === 2) parts.push('ساعتين');
      else if (hours <= 10) parts.push(hours + ' ساعات');
      else parts.push(hours + ' ساعة');
    }
    if (minutes > 0) {
      parts.push(minutes + ' دقيقة');
    }

    return parts.join(' و ');
  }

  // ============================================================
  // Business logic — Delay & Extra calculation
  // ============================================================

  /**
   * Calculates delay in minutes if check-in was after 10:15.
   * Returns 0 if on time or early.
   */
  function calculateDelay(checkInIso) {
    if (!checkInIso) return 0;

    const { totalMinutes } = getCairoTime(checkInIso);

    if (totalMinutes > GRACE_LIMIT_TOTAL) {
      return totalMinutes - GRACE_LIMIT_TOTAL;
    }
    return 0;
  }

  /**
   * Calculates the extra (bonus) minutes.
   *
   * Rule 1: Early arrival → minutes between check-in and 10:00 (no check-out required)
   * Rule 2: Late departure → minutes between 18:00 and check-out (check-out required)
   *
   * If both apply, they are summed.
   */
  function calculateExtra(checkInIso, checkOutIso) {
    let extra = 0;

    // Rule 1: Early arrival (before 10:00)
    if (checkInIso) {
      const { totalMinutes: inMinutes } = getCairoTime(checkInIso);
      if (inMinutes < WORK_START_TOTAL) {
        extra += (WORK_START_TOTAL - inMinutes);
      }
    }

    // Rule 2: Late departure (after 18:00) — requires check-out
    if (checkOutIso) {
      const { totalMinutes: outMinutes } = getCairoTime(checkOutIso);
      if (outMinutes > WORK_END_TOTAL) {
        extra += (outMinutes - WORK_END_TOTAL);
      }
    }

    return extra;
  }

  // ============================================================
  // Grouping
  // ============================================================
  function groupRecords(records) {
    const map = {};

    records.forEach(function (r) {
      const key = r.name + '|' + r.check_date;
      if (!map[key]) {
        map[key] = {
          name: r.name,
          check_date: r.check_date,
          checkIn: null,
          checkOut: null
        };
      }

      const entry = map[key];

      if (r.check_type === 'in') {
        if (!entry.checkIn) entry.checkIn = r;
      } else if (r.check_type === 'out') {
        entry.checkOut = r;
      }
    });

    return Object.values(map).sort(function (a, b) {
      return b.check_date.localeCompare(a.check_date);
    });
  }

  // ============================================================
  // UI helpers
  // ============================================================
  function setStatus(type, message) {
    statusBanner.className = 'status-banner';
    if (type === 'none') {
      statusBanner.style.display = 'none';
      statusBanner.textContent = '';
      return;
    }
    statusBanner.classList.add(type);
    statusBanner.textContent = message;
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ============================================================
  // Rendering
  // ============================================================
  function renderTable(grouped) {
    tableBody.innerHTML = '';

    if (!grouped || grouped.length === 0) {
      attendanceTable.style.display = 'none';
      emptyState.style.display = 'block';
      counterBadge.textContent = 'عدد الموظفين: 0';
      return;
    }

    attendanceTable.style.display = '';
    emptyState.style.display = 'none';

    const fragment = document.createDocumentFragment();

    grouped.forEach(function (entry, index) {
      const tr = document.createElement('tr');

      const checkInTime = entry.checkIn ? formatTime(entry.checkIn.created_at) : MISSING_TEXT;
      const checkInLoc  = entry.checkIn
        ? (entry.checkIn.full_address || entry.checkIn.city || entry.checkIn.governorate || EMPTY_TEXT)
        : MISSING_TEXT;

      const checkOutTime = entry.checkOut ? formatTime(entry.checkOut.created_at) : MISSING_TEXT;
      const checkOutLoc  = entry.checkOut
        ? (entry.checkOut.full_address || entry.checkOut.city || entry.checkOut.governorate || EMPTY_TEXT)
        : MISSING_TEXT;

      const mapsUrl = entry.checkIn
        ? 'https://maps.google.com/?q=' + entry.checkIn.lat + ',' + entry.checkIn.lng
        : '#';

      const checkInBadge = entry.checkIn
        ? '<span class="check-in-badge">' + checkInTime + '</span>'
        : '<span class="missing-cell">' + MISSING_TEXT + '</span>';

      const checkOutBadge = entry.checkOut
        ? '<span class="check-out-badge">' + checkOutTime + '</span>'
        : '<span class="missing-cell">' + MISSING_TEXT + '</span>';

      const checkInLocCell = entry.checkIn
        ? '<span title="' + escapeHtml(checkInLoc) + '">' + escapeHtml(checkInLoc) + '</span>'
        : '<span class="missing-cell">' + MISSING_TEXT + '</span>';

      const checkOutLocCell = entry.checkOut
        ? '<span title="' + escapeHtml(checkOutLoc) + '">' + escapeHtml(checkOutLoc) + '</span>'
        : '<span class="missing-cell">' + MISSING_TEXT + '</span>';

      // Calculate delay and extra
      const delayMinutes = calculateDelay(entry.checkIn ? entry.checkIn.created_at : null);
      const extraMinutes = calculateExtra(
        entry.checkIn ? entry.checkIn.created_at : null,
        entry.checkOut ? entry.checkOut.created_at : null
      );

      const delayCell = delayMinutes > 0
        ? '<span class="delay-badge">' + formatDuration(delayMinutes) + '</span>'
        : EMPTY_TEXT;

      const extraCell = extraMinutes > 0
        ? '<span class="extra-badge">' + formatDuration(extraMinutes) + '</span>'
        : EMPTY_TEXT;

      tr.innerHTML =
        '<td data-label="م">' + (index + 1) + '</td>' +
        '<td data-label="اسم الموظف" class="name-cell">' + escapeHtml(entry.name) + '</td>' +
        '<td data-label="التاريخ">' + formatDate(entry.check_date) + '</td>' +
        '<td data-label="Check In">' + checkInBadge + '</td>' +
        '<td data-label="Check In Location" class="address-cell">' + checkInLocCell + '</td>' +
        '<td data-label="Check Out">' + checkOutBadge + '</td>' +
        '<td data-label="Check Out Location" class="address-cell">' + checkOutLocCell + '</td>' +
        '<td data-label="تأخير">' + delayCell + '</td>' +
        '<td data-label="إضافي">' + extraCell + '</td>' +
        '<td data-label="الموقع">' +
          (entry.checkIn
            ? '<a class="map-link" href="' + mapsUrl + '" target="_blank" rel="noopener noreferrer">فتح الخريطة</a>'
            : EMPTY_TEXT) +
        '</td>';

      fragment.appendChild(tr);
    });

    tableBody.appendChild(fragment);
    counterBadge.textContent = 'عدد الموظفين: ' + grouped.length;
  }

  // ============================================================
  // Data loading
  // ============================================================
  async function loadData(showLoadingState) {
    const date = dateFilterEl.value;
    const name = nameFilterEl.value.trim();

    if (showLoadingState) setStatus('loading', 'جاري التحميل...');

    try {
      const { data, error } = await buildQuery(date, name);
      if (error) throw error;

      const grouped = groupRecords(data || []);
      renderTable(grouped);
      setStatus('none', '');
    } catch (err) {
      console.error('Failed to load attendance data:', err);
      setStatus('error', 'تعذر تحميل البيانات، حاول تاني');
    }
  }

  function resetFilters() {
    dateFilterEl.value = '';
    nameFilterEl.value = '';
    loadData(true);
  }

  // ============================================================
  // Excel export
  // ============================================================
  function buildExportRows(grouped) {
    return grouped.map(function (entry, index) {
      const checkInTime = entry.checkIn ? formatTime(entry.checkIn.created_at) : MISSING_TEXT;
      const checkInLoc  = entry.checkIn
        ? (entry.checkIn.full_address || entry.checkIn.city || entry.checkIn.governorate || EMPTY_TEXT)
        : MISSING_TEXT;

      const checkOutTime = entry.checkOut ? formatTime(entry.checkOut.created_at) : MISSING_TEXT;
      const checkOutLoc  = entry.checkOut
        ? (entry.checkOut.full_address || entry.checkOut.city || entry.checkOut.governorate || EMPTY_TEXT)
        : MISSING_TEXT;

      const delayMinutes = calculateDelay(entry.checkIn ? entry.checkIn.created_at : null);
      const extraMinutes = calculateExtra(
        entry.checkIn ? entry.checkIn.created_at : null,
        entry.checkOut ? entry.checkOut.created_at : null
      );

      return {
        'م': index + 1,
        'اسم الموظف': entry.name,
        'التاريخ': formatDate(entry.check_date),
        'Check In': checkInTime,
        'Check In Location': checkInLoc,
        'Check Out': checkOutTime,
        'Check Out Location': checkOutLoc,
        'تأخير': delayMinutes > 0 ? formatDuration(delayMinutes) : EMPTY_TEXT,
        'إضافي': extraMinutes > 0 ? formatDuration(extraMinutes) : EMPTY_TEXT
      };
    });
  }

  async function exportExcel() {
    try {
      const date = dateFilterEl.value;
      const name = nameFilterEl.value.trim();

      const { data, error } = await buildQuery(date, name);
      if (error) throw error;

      const grouped = groupRecords(data || []);
      const exportRows = buildExportRows(grouped);

      const worksheet = XLSX.utils.json_to_sheet(exportRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Attendance');

      // ---- Excel polish ----
      worksheet['!cols'] = [
        { wch: 5 },   // م
        { wch: 22 },  // اسم الموظف
        { wch: 14 },  // التاريخ
        { wch: 12 },  // Check In
        { wch: 38 },  // Check In Location
        { wch: 12 },  // Check Out
        { wch: 38 },  // Check Out Location
        { wch: 14 },  // تأخير
        { wch: 16 }   // إضافي
      ];

      // RTL layout for the sheet
      if (!worksheet['!views']) worksheet['!views'] = [];
      worksheet['!views'].push({ RTL: true });

      // Freeze header row
      worksheet['!freeze'] = { xSplit: 0, ySplit: 1 };

      // Autofilter over full range
      const range = XLSX.utils.decode_range(worksheet['!ref']);
      worksheet['!autofilter'] = { ref: XLSX.utils.encode_range(range) };

      const excelBuffer = XLSX.write(workbook, { type: 'array', bookType: 'xlsx' });
      const blob = new Blob([excelBuffer], { type: 'application/octet-stream' });

      const todayStr = new Date().toISOString().slice(0, 10);
      const fileName = date
        ? 'attendance-' + date + '.xlsx'
        : 'attendance-all-' + todayStr + '.xlsx';

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    } catch (err) {
      console.error('Failed to export Excel file:', err);
      alert('تعذر إنشاء ملف Excel');
    }
  }

  // ============================================================
  // Auto refresh
  // ============================================================
  function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(function () {
      loadData(false);
    }, AUTO_REFRESH_INTERVAL_MS);
  }

  // ============================================================
  // Events & Init
  // ============================================================
  applyBtn.addEventListener('click', function () { loadData(true); });
  resetBtn.addEventListener('click', resetFilters);
  exportBtn.addEventListener('click', exportExcel);

  loadData(true);
  startAutoRefresh();
})();
</script>

</body>
</html>
