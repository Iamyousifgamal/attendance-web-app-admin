<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأدمن - تسجيلات الحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ecf0f1;
    --card-bg: #ffffff;
    --header-bg: #34495e;
    --header-text: #ffffff;
    --primary: #2c3e50;
    --accent: #2980b9;
    --success: #27ae60;
    --success-dark: #1e8449;
    --danger: #c0392b;
    --warning: #e67e22;
    --warning-bg: #fef5e7;
    --danger-bg: #fdecea;
    --gray-btn: #95a5a6;
    --gray-btn-dark: #7f8c8d;
    --excel-btn: #27ae60;
    --excel-btn-dark: #1e8449;
    --text-main: #2c3e50;
    --text-muted: #7f8c8d;
    --border: #dfe4e6;
    --row-alt: #fafaff;
    --row-hover: #eef3f6;
    --shadow: 0 2px 10px rgba(0,0,0,0.08);
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
  }

  header.app-header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }

  header.app-header .logo-mark {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    flex-shrink: 0;
  }

  header.app-header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .toolbar-group label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
  }

  .toolbar input[type="date"],
  .toolbar input[type="text"],
  .toolbar select {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    background: #fff;
    color: var(--text-main);
    min-width: 140px;
  }

  .toolbar input:focus,
  .toolbar select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .btn {
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
    white-space: nowrap;
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { filter: brightness(0.92); }

  .btn-gray { background: var(--gray-btn); color: #fff; }
  .btn-gray:hover:not(:disabled) { background: var(--gray-btn-dark); }

  .btn-excel { background: var(--excel-btn); color: #fff; }
  .btn-excel:hover:not(:disabled) { background: var(--excel-btn-dark); }

  .counter-badge {
    margin-inline-start: auto;
    background: var(--primary);
    color: #fff;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }

  main {
    padding: 16px;
    max-width: 1800px;
    margin: 0 auto;
  }

  .status-banner {
    padding: 12px 16px;
    border-radius: var(--radius);
    margin-bottom: 14px;
    font-weight: 600;
    font-size: 14px;
    display: none;
  }

  .status-banner.error {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #f5c6cb;
    display: block;
  }

  .status-banner.loading {
    background: #eaf2fa;
    color: var(--accent);
    border: 1px solid #cfe2f3;
    display: block;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead th {
    background: #c5c5f0;
    color: #2c3e50;
    padding: 12px 10px;
    text-align: right;
    font-weight: 800;
    border: 1px solid #8a8ac7;
    position: sticky;
    top: 0;
    white-space: nowrap;
  }

  tbody td {
    padding: 10px;
    border: 1px solid #b8b8dd;
    vertical-align: middle;
  }

  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }

  td.name-cell { font-weight: 700; color: var(--primary); }

  td.address-cell {
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: help;
  }

  td.missing-cell {
    background: #e74c3c !important;
    color: #fff !important;
    font-weight: 700;
    text-align: center;
  }

  .time-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
    font-family: 'Cairo', monospace;
  }

  .time-in { background: #e8f8f0; color: var(--success-dark); }
  .time-out { background: var(--warning-bg); color: var(--warning); }

  .delay-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--danger-bg);
    color: var(--danger);
    font-weight: 700;
    font-size: 13px;
    font-family: 'Cairo', monospace;
  }

  .extra-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    background: #e8f8f0;
    color: var(--success-dark);
    font-weight: 700;
    font-size: 13px;
    font-family: 'Cairo', monospace;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 16px;
    font-weight: 600;
  }

  @media (max-width: 1100px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar-group { flex-direction: column; align-items: stretch; }
    .toolbar input, .toolbar select, .toolbar .btn { width: 100%; }
    .counter-badge { margin-inline-start: 0; text-align: center; }

    table, thead, tbody, th, tr, td {
      display: block;
      width: 100%;
    }

    thead { display: none; }

    tbody tr {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      background: var(--card-bg);
    }

    tbody tr:nth-child(even) { background: var(--card-bg); }

    tbody td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      text-align: left;
    }

    tbody td:last-child { border-bottom: none; }

    tbody td::before {
      content: attr(data-label);
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    td.address-cell {
      max-width: 100%;
      white-space: normal;
      text-align: right;
    }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="logo-mark">AT</div>
  <h1>لوحة الأدمن - تسجيلات الحضور</h1>
</header>

<div class="toolbar">
  <div class="toolbar-group">
    <label>من تاريخ:</label>
    <input type="date" id="dateFrom" aria-label="من تاريخ">
  </div>

  <div class="toolbar-group">
    <label>إلى تاريخ:</label>
    <input type="date" id="dateTo" aria-label="إلى تاريخ">
  </div>

  <div class="toolbar-group">
    <label>الموظف:</label>
    <input type="text" id="nameFilter" placeholder="ابحث بالاسم" aria-label="بحث بالاسم">
  </div>

  <div class="toolbar-group">
    <label>ترتيب الأيام:</label>
    <select id="dateSort">
      <option value="asc">تصاعدي (الأقدم أولاً)</option>
      <option value="desc">تنازلي (الأحدث أولاً)</option>
    </select>
  </div>

  <div class="toolbar-group">
    <label>ترتيب الأسماء:</label>
    <select id="nameSort">
      <option value="asc">تصاعدي (أ - ي)</option>
      <option value="desc">تنازلي (ي - أ)</option>
    </select>
  </div>

  <button class="btn btn-primary" id="applyBtn">عرض</button>
  <button class="btn btn-gray" id="resetBtn">عرض الكل</button>
  <button class="btn btn-excel" id="exportBtn">تحميل Excel</button>

  <span class="counter-badge" id="counterBadge">عدد الصفوف: 0</span>
</div>

<main>
  <div class="status-banner" id="statusBanner"></div>

  <div class="card">
    <div style="overflow-x:auto;">
      <table id="attendanceTable">
        <thead>
          <tr>
            <th>اسم الموظف</th>
            <th>تاريخ العمل</th>
            <th>Check In</th>
            <th>In Location</th>
            <th>Check Out</th>
            <th>Late Hours</th>
            <th>Overtime</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">لا توجد تسجيلات مطابقة</div>
  </div>
</main>

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- ExcelJS for styled Excel export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<script>
(function () {
  'use strict';

  // ============================================================
  // Supabase configuration — الـ URL الصح من Supabase Settings
  // ============================================================
const SUPABASE_URL = 'https://itahlydnrzembvbqbrdu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0YWhseWRucnplbWJ2YnFicmR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTc5NjEsImV4cCI6MjEwNTMzMzk2MX0.0ErheMPDk_6wbhv49hb3pCAHilmnaf_bcWEEPOYGNyc';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============================================================
  // Constants
  // ============================================================
  const VIEW_NAME = 'attendance_daily';
  const AUTO_REFRESH_INTERVAL_MS = 30000;

  // ---- Work schedule (بتوقيت مصر) ----
  const WORK_START_HOUR = 10;
  const WORK_START_MINUTE = 0;
  const GRACE_MINUTES = 15;
  const WORK_END_HOUR = 18;
  const WORK_END_MINUTE = 0;

  const WORK_START_TOTAL = WORK_START_HOUR * 60 + WORK_START_MINUTE;
  const GRACE_LIMIT_TOTAL = WORK_START_TOTAL + GRACE_MINUTES;
  const WORK_END_TOTAL = WORK_END_HOUR * 60 + WORK_END_MINUTE;

  // ============================================================
  // DOM references
  // ============================================================
  const dateFromEl = document.getElementById('dateFrom');
  const dateToEl = document.getElementById('dateTo');
  const nameFilterEl = document.getElementById('nameFilter');
  const dateSortEl = document.getElementById('dateSort');
  const nameSortEl = document.getElementById('nameSort');
  const applyBtn = document.getElementById('applyBtn');
  const resetBtn = document.getElementById('resetBtn');
  const exportBtn = document.getElementById('exportBtn');
  const counterBadge = document.getElementById('counterBadge');
  const statusBanner = document.getElementById('statusBanner');
  const tableBody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  const attendanceTable = document.getElementById('attendanceTable');

  let autoRefreshTimer = null;

  // ============================================================
  // Supabase query
  // ============================================================
  function buildQuery() {
    const fromDate = dateFromEl.value;
    const toDate = dateToEl.value;
    const name = nameFilterEl.value.trim();

    let query = supabase.from(VIEW_NAME).select('*');

    if (fromDate) query = query.gte('check_date', fromDate);
    if (toDate) query = query.lte('check_date', toDate);
    if (name) query = query.ilike('name', '%' + name + '%');

    return query;
  }

  // ============================================================
  // Sorting
  // ============================================================
  function sortRecords(records) {
    const nameDir = nameSortEl.value === 'asc' ? 1 : -1;
    const dateDir = dateSortEl.value === 'asc' ? 1 : -1;

    return records.slice().sort(function (a, b) {
      const nameCompare = (a.name || '').localeCompare(b.name || '', 'ar');
      if (nameCompare !== 0) return nameCompare * nameDir;
      return (a.check_date || '').localeCompare(b.check_date || '') * dateDir;
    });
  }

  // ============================================================
  // Helpers
  // ============================================================
  function getCairoTime(isoString) {
    const d = new Date(isoString);
    const formatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Africa/Cairo',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });
    const parts = formatter.formatToParts(d);
    const hours = parseInt(parts.find(p => p.type === 'hour').value, 10);
    const minutes = parseInt(parts.find(p => p.type === 'minute').value, 10);
    return { hours, minutes, totalMinutes: hours * 60 + minutes };
  }

  function formatInOutTime(isoString) {
    if (!isoString) return '';
    const d = new Date(isoString);
    return d.toLocaleTimeString('ar-EG', {
      timeZone: 'Africa/Cairo',
      hour: '2-digit',
      minute: '2-digit',
      hour12: true
    });
  }

  function formatWorkDate(dateString) {
    if (!dateString) return '';
    const parts = dateString.split('-');
    if (parts.length !== 3) return dateString;
    return parts[2] + '-' + parts[1] + '-' + parts[0];
  }

  function formatDurationHHMM(totalMinutes) {
    if (!totalMinutes || totalMinutes <= 0) return '00:00';
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0');
  }

  function calculateDelay(checkInIso) {
    if (!checkInIso) return 0;
    const { totalMinutes } = getCairoTime(checkInIso);
    if (totalMinutes > GRACE_LIMIT_TOTAL) return totalMinutes - GRACE_LIMIT_TOTAL;
    return 0;
  }

  function calculateOvertime(checkInIso, checkOutIso) {
    let extra = 0;
    if (checkInIso) {
      const { totalMinutes: inMin } = getCairoTime(checkInIso);
      if (inMin < WORK_START_TOTAL) extra += (WORK_START_TOTAL - inMin);
    }
    if (checkOutIso) {
      const { totalMinutes: outMin } = getCairoTime(checkOutIso);
      if (outMin > WORK_END_TOTAL) extra += (outMin - WORK_END_TOTAL);
    }
    return extra;
  }

  function setStatus(type, message) {
    statusBanner.className = 'status-banner';
    if (type === 'none') {
      statusBanner.style.display = 'none';
      statusBanner.textContent = '';
      return;
    }
    statusBanner.classList.add(type);
    statusBanner.textContent = message;
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ============================================================
  // Rendering
  // ============================================================
  function renderTable(records) {
    tableBody.innerHTML = '';

    if (!records || records.length === 0) {
      attendanceTable.style.display = 'none';
      emptyState.style.display = 'block';
      counterBadge.textContent = 'عدد الصفوف: 0';
      return;
    }

    attendanceTable.style.display = '';
    emptyState.style.display = 'none';

    const fragment = document.createDocumentFragment();

    records.forEach(function (r) {
      const tr = document.createElement('tr');

      const inTime = r.check_in_at ? formatInOutTime(r.check_in_at) : '';
      const outTime = r.check_out_at ? formatInOutTime(r.check_out_at) : '';
      const inLoc = r.check_in_location || '';

      const delayMinutes = calculateDelay(r.check_in_at);
      const overtimeMinutes = calculateOvertime(r.check_in_at, r.check_out_at);

      const inCell = inTime
        ? '<span class="time-badge time-in">' + inTime + '</span>'
        : '—';

      const outCell = outTime
        ? '<span class="time-badge time-out">' + outTime + '</span>'
        : '—';

      const outTdClass = !outTime ? ' class="missing-cell"' : '';
      const outTdContent = !outTime ? '—' : outCell;

      const delayCell = '<span class="delay-badge">' + formatDurationHHMM(delayMinutes) + '</span>';
      const overtimeCell = '<span class="extra-badge">' + formatDurationHHMM(overtimeMinutes) + '</span>';

      const inLocCell = inLoc
        ? '<span title="' + escapeHtml(inLoc) + '">' + escapeHtml(inLoc) + '</span>'
        : '—';

      tr.innerHTML =
        '<td data-label="اسم الموظف" class="name-cell">' + escapeHtml(r.name) + '</td>' +
        '<td data-label="تاريخ العمل">' + formatWorkDate(r.check_date) + '</td>' +
        '<td data-label="Check In">' + inCell + '</td>' +
        '<td data-label="In Location" class="address-cell">' + inLocCell + '</td>' +
        '<td data-label="Check Out"' + outTdClass + '>' + outTdContent + '</td>' +
        '<td data-label="Late Hours">' + delayCell + '</td>' +
        '<td data-label="Overtime">' + overtimeCell + '</td>';

      fragment.appendChild(tr);
    });

    tableBody.appendChild(fragment);
    counterBadge.textContent = 'عدد الصفوف: ' + records.length;
  }

  // ============================================================
  // Load data
  // ============================================================
  async function loadData(showLoadingState) {
    if (showLoadingState) setStatus('loading', 'جاري التحميل...');

    try {
      const { data, error } = await buildQuery();
      if (error) throw error;

      const sorted = sortRecords(data || []);
      renderTable(sorted);
      setStatus('none', '');
    } catch (err) {
      console.error('Failed to load attendance data:', err);
      setStatus('error', 'تعذر تحميل البيانات، حاول تاني');
    }
  }

  function resetFilters() {
    dateFromEl.value = '';
    dateToEl.value = '';
    nameFilterEl.value = '';
    dateSortEl.value = 'asc';
    nameSortEl.value = 'asc';
    loadData(true);
  }

  // ============================================================
  // Excel Export (ExcelJS — styled like the website)
  // ============================================================
  async function exportExcel() {
    const originalText = exportBtn.textContent;
    exportBtn.disabled = true;
    exportBtn.textContent = '⏳ جاري التحضير...';

    try {
      const { data, error } = await buildQuery();
      if (error) throw error;

      const sorted = sortRecords(data || []);

      if (sorted.length === 0) {
        alert('لا توجد بيانات لتصديرها');
        exportBtn.disabled = false;
        exportBtn.textContent = originalText;
        return;
      }

      // ---- Create workbook ----
      const workbook = new ExcelJS.Workbook();
      workbook.creator = 'Attendance System';
      workbook.created = new Date();

      const worksheet = workbook.addWorksheet('Attendance', {
        views: [{ rightToLeft: true }]
      });

      // ---- Define columns ----
      worksheet.columns = [
        { header: 'اسم الموظف', key: 'name', width: 24 },
        { header: 'تاريخ العمل', key: 'date', width: 16 },
        { header: 'Check In', key: 'checkIn', width: 14 },
        { header: 'In Location', key: 'inLocation', width: 45 },
        { header: 'Check Out', key: 'checkOut', width: 14 },
        { header: 'Late Hours', key: 'late', width: 14 },
        { header: 'Overtime', key: 'overtime', width: 14 }
      ];

      // ---- Style header row ----
      const headerRow = worksheet.getRow(1);
      headerRow.height = 28;
      headerRow.eachCell(function (cell) {
        cell.font = {
          name: 'Cairo',
          size: 12,
          bold: true,
          color: { argb: 'FF2C3E50' }
        };
        cell.fill = {
          type: 'pattern',
          pattern: 'solid',
          fgColor: { argb: 'FFC5C5F0' }   // لون بنفسجي فاتح (زي الموقع)
        };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.border = {
          top:    { style: 'thin', color: { argb: 'FF8A8AC7' } },
          bottom: { style: 'thin', color: { argb: 'FF8A8AC7' } },
          left:   { style: 'thin', color: { argb: 'FF8A8AC7' } },
          right:  { style: 'thin', color: { argb: 'FF8A8AC7' } }
        };
      });

      // ---- Add data rows ----
      sorted.forEach(function (r, index) {
        const inTime = r.check_in_at ? formatInOutTime(r.check_in_at) : '';
        const outTime = r.check_out_at ? formatInOutTime(r.check_out_at) : '';
        const inLoc = r.check_in_location || '';
        const delayMin = calculateDelay(r.check_in_at);
        const overtimeMin = calculateOvertime(r.check_in_at, r.check_out_at);

        const row = worksheet.addRow({
          name: r.name,
          date: formatWorkDate(r.check_date),
          checkIn: inTime || '—',
          inLocation: inLoc || '—',
          checkOut: outTime || '—',
          late: formatDurationHHMM(delayMin),
          overtime: formatDurationHHMM(overtimeMin)
        });

        row.height = 24;

        // Apply styles to each cell
        row.eachCell({ includeEmpty: true }, function (cell, colNumber) {
          cell.font = {
            name: 'Cairo',
            size: 11,
            color: { argb: 'FF2C3E50' }
          };
          cell.alignment = { horizontal: 'center', vertical: 'middle' };
          cell.border = {
            top:    { style: 'thin', color: { argb: 'FFB8B8DD' } },
            bottom: { style: 'thin', color: { argb: 'FFB8B8DD' } },
            left:   { style: 'thin', color: { argb: 'FFB8B8DD' } },
            right:  { style: 'thin', color: { argb: 'FFB8B8DD' } }
          };

          // Even rows: alternate background
          if (index % 2 === 1) {
            cell.fill = {
              type: 'pattern',
              pattern: 'solid',
              fgColor: { argb: 'FFFAFAFF' }
            };
          }
        });

        // ---- Special styling for columns ----

        // 1) Missing Check Out → red fill
        if (!outTime) {
          const outCell = row.getCell('checkOut');
          outCell.fill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFE74C3C' }
          };
          outCell.font = { name: 'Cairo', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
        } else {
          // Green/tan badge style
          const outCell = row.getCell('checkOut');
          outCell.font = { name: 'Cairo', size: 11, bold: true, color: { argb: 'FFE67E22' } };
          outCell.fill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFFEF5E7' }
          };
        }

        // 2) Check In → green badge
        const inCell = row.getCell('checkIn');
        if (inTime) {
          inCell.font = { name: 'Cairo', size: 11, bold: true, color: { argb: 'FF1E8449' } };
          inCell.fill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFE8F8F0' }
          };
        }

        // 3) Late Hours → red badge (only if > 0)
        const lateCell = row.getCell('late');
        if (delayMin > 0) {
          lateCell.font = { name: 'Cairo', size: 11, bold: true, color: { argb: 'FFC0392B' } };
          lateCell.fill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFFDECEA' }
          };
        }

        // 4) Overtime → green badge (only if > 0)
        const overtimeCell = row.getCell('overtime');
        if (overtimeMin > 0) {
          overtimeCell.font = { name: 'Cairo', size: 11, bold: true, color: { argb: 'FF1E8449' } };
          overtimeCell.fill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFE8F8F0' }
          };
        }

        // 5) Name cell → bold
        row.getCell('name').font = {
          name: 'Cairo', size: 11, bold: true, color: { argb: 'FF2C3E50' }
        };

        // 6) In Location → smaller font, aligned right
        row.getCell('inLocation').font = {
          name: 'Cairo', size: 10, color: { argb: 'FF555555' }
        };
        row.getCell('inLocation').alignment = {
          horizontal: 'right', vertical: 'middle', wrapText: true
        };
      });

      // ---- Freeze header row ----
      worksheet.views = [
        { state: 'frozen', ySplit: 1, rightToLeft: true }
      ];

      // ---- Auto filter ----
      worksheet.autoFilter = {
        from: { row: 1, column: 1 },
        to:   { row: 1, column: 7 }
      };

      // ---- Write & download ----
      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });

      const fromDate = dateFromEl.value;
      const toDate = dateToEl.value;
      let fileName;
      if (fromDate && toDate) fileName = 'attendance-' + fromDate + '-to-' + toDate + '.xlsx';
      else if (fromDate) fileName = 'attendance-from-' + fromDate + '.xlsx';
      else if (toDate) fileName = 'attendance-until-' + toDate + '.xlsx';
      else fileName = 'attendance-all-' + new Date().toISOString().slice(0, 10) + '.xlsx';

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);

      exportBtn.disabled = false;
      exportBtn.textContent = originalText;
    } catch (err) {
      console.error('Failed to export Excel file:', err);
      alert('تعذر إنشاء ملف Excel');
      exportBtn.disabled = false;
      exportBtn.textContent = originalText;
    }
  }

  // ============================================================
  // Auto refresh
  // ============================================================
  function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(function () {
      loadData(false);
    }, AUTO_REFRESH_INTERVAL_MS);
  }

  // ============================================================
  // Events & Init
  // ============================================================
  applyBtn.addEventListener('click', function () { loadData(true); });
  resetBtn.addEventListener('click', resetFilters);
  exportBtn.addEventListener('click', exportExcel);

  dateSortEl.addEventListener('change', function () { loadData(false); });
  nameSortEl.addEventListener('change', function () { loadData(false); });

  loadData(true);
  startAutoRefresh();
})();
</script>

</body>
